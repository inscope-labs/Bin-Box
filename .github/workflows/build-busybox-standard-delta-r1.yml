name: Build BusyBox Standard-Delta Tier (RTX-100 Phase 2.1b)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUSYBOX_MIRROR_COMMIT: 1a64f6a20aaf6ea4dbba68bbfa8cc1ab7e5c57c4
  BUSYBOX_TARBALL_SHA256: 076a7449075feea57afc2750b10a9ff5e95e93f782ad454404fedd10a27c2933
  NDK_VERSION: 27.3.13750724
  MIN_SDK: 24

jobs:
  build:
    name: Build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android

          - abi: x86_64
            triple: x86_64-linux-android

          - abi: armeabi-v7a
            triple: armv7a-linux-androideabi

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Verify NDK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -eux

          test -n "$NDK_HOME"
          test -d "$NDK_HOME"

          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/llvm-ar"
          test -x "$TOOLCHAIN/llvm-strip"

          echo "NDK_HOME=$NDK_HOME"
          echo "Toolchain=$TOOLCHAIN"

          "$TOOLCHAIN/clang" --version

      - name: Fetch pinned BusyBox source
        run: |
          set -eux

          curl -fL \
            "https://codeload.github.com/mirror/busybox/tar.gz/${BUSYBOX_MIRROR_COMMIT}" \
            -o busybox-src.tar.gz

          echo "${BUSYBOX_TARBALL_SHA256}  busybox-src.tar.gz" \
            | sha256sum -c -

          rm -rf busybox-src
          mkdir -p busybox-src

          tar \
            -xzf busybox-src.tar.gz \
            --strip-components=1 \
            -C busybox-src

          test -f busybox-src/Makefile
          test -f busybox-src/Config.in

      - name: Generate closed Standard-delta configuration
        run: |
          set -eux

          cd busybox-src

          # The repository configuration is a DELTA specification.
          #
          # It must not be passed directly to "make oldconfig", because
          # unspecified BusyBox symbols can acquire their Kconfig defaults.
          #
          # In particular, BusyBox's shell choice defaults to SH_IS_ASH.
          # That would incorrectly pull the Base shell into this Standard
          # delta.
          #
          # Therefore:
          #
          #   1. Start from allnoconfig.
          #   2. Enable ONLY the Standard-delta symbols.
          #   3. Explicitly force both shell aliases to NONE.
          #   4. Normalize the result with olddefconfig.
          #
          # This produces a complete, deterministic CI .config.

          make allnoconfig

          # Standard-delta applets.
          cat >> .config <<'EOF'

          CONFIG_GREP=y
          CONFIG_SED=y
          CONFIG_AWK=y
          CONFIG_FIND=y
          CONFIG_DU=y
          CONFIG_DF=y
          CONFIG_STAT=y
          CONFIG_TAR=y
          CONFIG_GZIP=y
          CONFIG_UNZIP=y
          CONFIG_WGET=y
          CONFIG_PING=y
          CONFIG_LESS=y
          CONFIG_HEAD=y
          CONFIG_TAIL=y
          CONFIG_WC=y
          CONFIG_SORT=y
          CONFIG_UNIQ=y
          CONFIG_CUT=y
          CONFIG_DIFF=y
          CONFIG_XARGS=y
          CONFIG_TEE=y

          CONFIG_SH_IS_NONE=y
          EOF

          # Normalize the configuration without interactive prompts.
          make olddefconfig

          echo
          echo "===== Standard-delta configuration ====="
          grep -E \
            '^(CONFIG_(GREP|SED|AWK|FIND|DU|DF|STAT|TAR|GZIP|UNZIP|WGET|PING|LESS|HEAD|TAIL|WC|SORT|UNIQ|CUT|DIFF|XARGS|TEE|SH_IS_NONE)|# CONFIG_(ASH|LS|CP|MV|RM|MKDIR|CAT|CHMOD|PS|KILL|ENV|WHICH|UNAME|SH_IS_ASH|SHELL_ASH) is not set)' \
            .config \
            || true

          echo
          echo "===== Positive Standard-delta checks ====="

          for sym in \
            GREP \
            SED \
            AWK \
            FIND \
            DU \
            DF \
            STAT \
            TAR \
            GZIP \
            UNZIP \
            WGET \
            PING \
            LESS \
            HEAD \
            TAIL \
            WC \
            SORT \
            UNIQ \
            CUT \
            DIFF \
            XARGS \
            TEE \
            SH_IS_NONE
          do
            grep -q "^CONFIG_${sym}=y$" .config || {
              echo "ERROR: MISSING CONFIG_${sym}=y"
              exit 1
            }
          done

          echo
          echo "===== Negative Base-tier checks ====="

          for sym in \
            ASH \
            LS \
            CP \
            MV \
            RM \
            MKDIR \
            CAT \
            CHMOD \
            PS \
            KILL \
            ENV \
            WHICH \
            UNAME \
            SH_IS_ASH \
            SHELL_ASH
          do
            if grep -q "^CONFIG_${sym}=y$" .config; then
              echo "ERROR: UNEXPECTED CONFIG_${sym}=y"
              echo "This is a Base-tier symbol and must not appear in Standard-delta."
              exit 1
            fi
          done

          echo
          echo "===== Shell exclusion checks ====="

          grep -q "^CONFIG_SH_IS_NONE=y$" .config

          if grep -q "^CONFIG_SH_IS_ASH=y$" .config; then
            echo "ERROR: SH_IS_ASH unexpectedly enabled"
            exit 1
          fi

          if grep -q "^CONFIG_SHELL_ASH=y$" .config; then
            echo "ERROR: SHELL_ASH unexpectedly enabled"
            exit 1
          fi

          echo
          echo "Standard-delta configuration validated successfully."

      - name: Cross-compile for ${{ matrix.abi }}
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -eux

          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TOOLCHAIN/${{ matrix.triple }}${MIN_SDK}-clang"

          test -x "$CC"

          cd busybox-src

          make -j"$(nproc)" \
            ARCH="${{ matrix.abi }}" \
            CC="$CC" \
            AR="$TOOLCHAIN/llvm-ar" \
            STRIP="$TOOLCHAIN/llvm-strip" \
            RANLIB="$TOOLCHAIN/llvm-ranlib" \
            NM="$TOOLCHAIN/llvm-nm"

      - name: Verify output binary
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -eux

          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          cd busybox-src

          test -f busybox_unstripped

          file busybox_unstripped

          file busybox_unstripped \
            | grep -q "ELF" || {
              echo "ERROR: output is not an ELF binary"
              exit 1
            }

          "$TOOLCHAIN/llvm-strip" \
            -o busybox \
            busybox_unstripped

          test -s busybox

          file busybox

          echo
          echo "BusyBox Standard-delta binary created successfully."

      - name: Upload ${{ matrix.abi }} binary
        uses: actions/upload-artifact@v4
        with:
          name: busybox-standard-delta-${{ matrix.abi }}
          path: busybox-src/busybox
          if-no-files-found: error