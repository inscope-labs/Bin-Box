name: Build BusyBox Standard-Delta Tier (RTX-100 Phase 2.1b_r1)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUSYBOX_MIRROR_COMMIT: 1a64f6a20aaf6ea4dbba68bbfa8cc1ab7e5c57c4
  BUSYBOX_TARBALL_SHA256: 076a7449075feea57afc2750b10a9ff5e95e93f782ad454404fedd10a27c2933
  NDK_VERSION: 27.3.13750724
  MIN_SDK: 24

jobs:
  build:
    name: Build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android

          - abi: x86_64
            triple: x86_64-linux-android

          - abi: armeabi-v7a
            triple: armv7a-linux-androideabi

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Verify NDK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -eux

          test -n "$NDK_HOME"
          test -d "$NDK_HOME"

          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/llvm-ar"
          test -x "$TOOLCHAIN/llvm-strip"
          test -x "$TOOLCHAIN/llvm-ranlib"
          test -x "$TOOLCHAIN/llvm-nm"

          echo "NDK_HOME=$NDK_HOME"
          echo "Toolchain=$TOOLCHAIN"

          "$TOOLCHAIN/clang" --version

      - name: Fetch pinned BusyBox source
        run: |
          set -eux

          curl -fL \
            "https://codeload.github.com/mirror/busybox/tar.gz/${BUSYBOX_MIRROR_COMMIT}" \
            -o busybox-src.tar.gz

          echo "${BUSYBOX_TARBALL_SHA256}  busybox-src.tar.gz" \
            | sha256sum -c -

          rm -rf busybox-src
          mkdir -p busybox-src

          tar \
            -xzf busybox-src.tar.gz \
            --strip-components=1 \
            -C busybox-src

          test -f busybox-src/Makefile
          test -f busybox-src/Config.in

      - name: Generate closed Standard-delta configuration
        run: |
          set -eux

          cd busybox-src

          echo "Creating clean all-disabled BusyBox configuration..."

          # BusyBox provides allnoconfig specifically for creating
          # a new configuration with every option answered "no".
          #
          # IMPORTANT:
          # Do NOT run oldconfig or olddefconfig here.
          #
          # This pinned BusyBox release does not provide olddefconfig,
          # and oldconfig is interactive by design.

          make allnoconfig

          test -f .config

          #
          # Helper:
          # Replace an existing Kconfig assignment with the requested
          # value, or append it if allnoconfig did not emit the symbol.
          #
          set_config() {
            local sym="$1"
            local value="$2"

            if grep -q "^CONFIG_${sym}=" .config; then
              sed -i \
                "s/^CONFIG_${sym}=.*/CONFIG_${sym}=${value}/" \
                .config
            elif grep -q "^# CONFIG_${sym} is not set$" .config; then
              sed -i \
                "s/^# CONFIG_${sym} is not set$/CONFIG_${sym}=${value}/" \
                .config
            else
              printf 'CONFIG_%s=%s\n' "$sym" "$value" >> .config
            fi
          }

          #
          # Standard-delta applets.
          #
          for sym in \
            GREP \
            SED \
            AWK \
            FIND \
            DU \
            DF \
            STAT \
            TAR \
            GZIP \
            UNZIP \
            WGET \
            PING \
            LESS \
            HEAD \
            TAIL \
            WC \
            SORT \
            UNIQ \
            CUT \
            DIFF \
            XARGS \
            TEE
          do
            set_config "$sym" y
          done

          #
          # Explicitly select NONE for every shell alias choice.
          #
          # This is important because Standard-delta must NOT inherit
          # ash/hush merely because Kconfig has a default.
          #
          set_config SH_IS_NONE y
          set_config SH_IS_ASH n
          set_config SH_IS_HUSH n

          #
          # Explicitly disable the actual shell implementations.
          #
          set_config ASH n
          set_config HUSH n
          set_config SHELL_ASH n
          set_config SHELL_HUSH n
          set_config CTTYHACK n

          #
          # Disable common shell infrastructure.
          #
          set_config FEATURE_SH_MATH n
          set_config FEATURE_SH_EXTRA_QUIET n
          set_config FEATURE_SH_STANDALONE n
          set_config FEATURE_SH_NOFORK n
          set_config FEATURE_SH_READ_FRAC n
          set_config FEATURE_SH_HISTFILESIZE n
          set_config FEATURE_SH_EMBEDDED_SCRIPTS n

          #
          # Disable additional shell-dependent functionality.
          #
          set_config ASH_OPTIMIZE_FOR_SIZE n
          set_config ASH_INTERNAL_GLOB n
          set_config ASH_BASH_COMPAT n
          set_config ASH_JOB_CONTROL n
          set_config ASH_ALIAS n
          set_config ASH_RANDOM_SUPPORT n
          set_config ASH_EXPAND_PRMT n
          set_config ASH_IDLE_TIMEOUT n
          set_config ASH_MAIL n
          set_config ASH_ECHO n
          set_config ASH_PRINTF n
          set_config ASH_TEST n
          set_config ASH_SLEEP n
          set_config ASH_HELP n
          set_config ASH_GETOPTS n
          set_config ASH_CMDCMD n

          #
          # Prevent unrelated utilities from being pulled in.
          #
          set_config KLOGD n
          set_config LOGGER n
          set_config LOGREAD n
          set_config SYSLOGD n

          #
          # BusyBox's own Kconfig Makefile documents that when .config
          # is modified after allnoconfig, a delay is required before
          # the normal build so include/autoconf.h is regenerated.
          #
          sleep 2

          echo
          echo "=============================================="
          echo "Standard-delta positive configuration"
          echo "=============================================="

          for sym in \
            GREP \
            SED \
            AWK \
            FIND \
            DU \
            DF \
            STAT \
            TAR \
            GZIP \
            UNZIP \
            WGET \
            PING \
            LESS \
            HEAD \
            TAIL \
            WC \
            SORT \
            UNIQ \
            CUT \
            DIFF \
            XARGS \
            TEE \
            SH_IS_NONE
          do
            grep -q "^CONFIG_${sym}=y$" .config || {
              echo "ERROR: CONFIG_${sym}=y is missing"
              exit 1
            }
          done

          echo
          echo "=============================================="
          echo "Base-tier exclusion checks"
          echo "=============================================="

          for sym in \
            ASH \
            HUSH \
            LS \
            CP \
            MV \
            RM \
            MKDIR \
            CAT \
            CHMOD \
            PS \
            KILL \
            ENV \
            WHICH \
            UNAME \
            SHELL_ASH \
            SHELL_HUSH \
            CTTYHACK \
            SH_IS_ASH \
            SH_IS_HUSH
          do
            if grep -q "^CONFIG_${sym}=y$" .config; then
              echo "ERROR: CONFIG_${sym}=y"
              echo "This symbol must not be enabled in Standard-delta."
              exit 1
            fi
          done

          echo
          echo "=============================================="
          echo "Final relevant configuration"
          echo "=============================================="

          grep -E \
            '^CONFIG_(GREP|SED|AWK|FIND|DU|DF|STAT|TAR|GZIP|UNZIP|WGET|PING|LESS|HEAD|TAIL|WC|SORT|UNIQ|CUT|DIFF|XARGS|TEE|SH_IS_NONE|SH_IS_ASH|SH_IS_HUSH|ASH|HUSH|SHELL_ASH|SHELL_HUSH|CTTYHACK)=' \
            .config \
            || true

          echo
          echo "Standard-delta configuration validated successfully."

      - name: Cross-compile for ${{ matrix.abi }}
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -eux

          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="$TOOLCHAIN/${{ matrix.triple }}${MIN_SDK}-clang"

          test -x "$CC"

          cd busybox-src

          make -j"$(nproc)" \
            ARCH="${{ matrix.abi }}" \
            CC="$CC" \
            AR="$TOOLCHAIN/llvm-ar" \
            STRIP="$TOOLCHAIN/llvm-strip" \
            RANLIB="$TOOLCHAIN/llvm-ranlib" \
            NM="$TOOLCHAIN/llvm-nm"

      - name: Verify output binary
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -eux

          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          cd busybox-src

          test -f busybox_unstripped

          file busybox_unstripped

          file busybox_unstripped \
            | grep -q "ELF" || {
              echo "ERROR: busybox_unstripped is not an ELF binary"
              exit 1
            }

          "$TOOLCHAIN/llvm-strip" \
            -o busybox \
            busybox_unstripped

          test -s busybox

          file busybox

          echo
          echo "BusyBox Standard-delta binary created successfully."

      - name: Upload ${{ matrix.abi }} binary
        uses: actions/upload-artifact@v4
        with:
          name: busybox-standard-delta-${{ matrix.abi }}
          path: busybox-src/busybox
          if-no-files-found: error