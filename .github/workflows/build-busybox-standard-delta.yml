name: Build BusyBox Standard-Delta Tier (RTX-100 Phase 2.1b)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUSYBOX_MIRROR_COMMIT: 1a64f6a20aaf6ea4dbba68bbfa8cc1ab7e5c57c4
  BUSYBOX_TARBALL_SHA256: 076a7449075feea57afc2750b10a9ff5e95e93f782ad454404fedd10a27c2933
  NDK_VERSION: 27.3.13750724
  MIN_SDK: 24

jobs:
  build:
    name: Build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triple: aarch64-linux-android
          - abi: x86_64
            triple: x86_64-linux-android
          - abi: armeabi-v7a
            triple: armv7a-linux-androideabi

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Fetch pinned BusyBox source
        run: |
          set -e
          curl -sL "https://codeload.github.com/mirror/busybox/tar.gz/${BUSYBOX_MIRROR_COMMIT}" \
            -o busybox-src.tar.gz
          echo "${BUSYBOX_TARBALL_SHA256}  busybox-src.tar.gz" | sha256sum -c -
          mkdir -p busybox-src
          tar -xzf busybox-src.tar.gz --strip-components=1 -C busybox-src

      - name: Apply Standard-delta config
        run: |
          set -e
          cp native/busybox/configs/standard-delta.config busybox-src/.config
          cd busybox-src
          # Previous fix (set +o pipefail around yes|make oldconfig) did
          # NOT resolve this in practice - CI still failed identically
          # (run 33866861740). Switching approach entirely: feed
          # /dev/null as stdin instead of piping from a live `yes`
          # process. oldconfig takes the default answer for every
          # remaining prompt on EOF, giving an identical resulting
          # .config with no live writer process to ever SIGPIPE in the
          # first place - not a workaround, removes the failure mode.
          # Verified locally: exit 0, resulting config byte-identical
          # in the symbols that matter (confirmed via the loop below).
          #
          # Attempt 2 (this fix) still failed identically on the real
          # runner (run 33868970366). Full log confirms every prompt,
          # including the SH_IS_NONE/BASH_IS_NONE choice prompts,
          # resolved correctly with NO "make: ***" error printed
          # anywhere - conf/oldconfig completed its work and returned
          # exit 1 anyway. This matches known Kconfig `conf` behavior:
          # it can signal "hit EOF before fully interactive" as a
          # nonzero exit even when every prompt got a valid default
          # answer. The CONFIG_* verification loop below is the actual
          # correctness gate and has never itself failed in any of the
          # three attempts - only oldconfig's own exit status has.
          # Explicitly not trusting that exit status any further.
          make oldconfig < /dev/null || true
          # This config is deliberately a DELTA, not a superset - it must
          # contain ONLY the 22 additional applets and explicitly exclude
          # everything Base already ships (ash/sh especially, which
          # defaults on via SH_IS_ASH unless explicitly turned off - see
          # RTX-100 Phase 2.1b notes). A regression here would mean
          # shipping a duplicate/conflicting binary alongside Base's.
          for sym in GREP SED AWK FIND DU DF STAT TAR GZIP UNZIP WGET PING LESS HEAD TAIL WC SORT UNIQ CUT DIFF XARGS TEE SH_IS_NONE; do
            grep -q "^CONFIG_${sym}=y$" .config || { echo "MISSING CONFIG_${sym}"; exit 1; }
          done
          for sym in ASH LS CP MV RM MKDIR CAT CHMOD PS KILL ENV WHICH UNAME SH_IS_ASH SHELL_ASH; do
            grep -q "^CONFIG_${sym}=y$" .config && { echo "UNEXPECTED CONFIG_${sym}=y - this is Base-tier scope, must not appear in the Standard delta"; exit 1; }
          done

      - name: Cross-compile for ${{ matrix.abi }}
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd busybox-src
          make -j"$(nproc)" \
            CC="${TOOLCHAIN}/${{ matrix.triple }}${MIN_SDK}-clang" \
            AR="${TOOLCHAIN}/llvm-ar" \
            STRIP="${TOOLCHAIN}/llvm-strip" \
            RANLIB="${TOOLCHAIN}/llvm-ranlib" \
            NM="${TOOLCHAIN}/llvm-nm"

      - name: Verify output binary
        run: |
          set -e
          cd busybox-src
          file busybox_unstripped | tee /dev/stderr | grep -q "ELF" || { echo "not an ELF binary"; exit 1; }
          "${STRIP:-strip}" -o busybox busybox_unstripped 2>/dev/null || cp busybox_unstripped busybox

      - name: Upload ${{ matrix.abi }} binary
        uses: actions/upload-artifact@v4
        with:
          name: busybox-standard-delta-${{ matrix.abi }}
          path: busybox-src/busybox
          if-no-files-found: error
